<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV Founders Tools</title>
    <meta name="description"
        content="A suite of tools for startup founders including equity modeling and revenue calculators.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .hub-card {
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .hub-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px var(--shadow-color);
            border-color: #7c6dff;
        }

        .hub-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7c6dff, #00d2ff);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .hub-card:hover::before {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- MENU DRAWER OVERLAY -->
        <div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>
        <div class="drawer" id="appDrawer">
            <div class="drawer-header">
                <div class="logo">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="lgDrawer1" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#7c6dff" />
                                <stop offset="100%" stop-color="#00d2ff" />
                            </linearGradient>
                            <linearGradient id="lgDrawer2" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#7c6dff" stop-opacity="0.18" />
                                <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.08" />
                            </linearGradient>
                        </defs>
                        <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                            stroke="url(#lgDrawer1)" stroke-width="1.8" />
                        <rect x="10.5" y="16.2" width="15" height="3.6" rx="1.8" fill="url(#lgDrawer1)" />
                        <rect x="16.2" y="10.5" width="3.6" height="15" rx="1.8" fill="url(#lgDrawer1)" />
                    </svg>
                    <span class="logo-text">SV<span class="logo-accent">Tools</span></span>
                </div>
                <button class="drawer-close" onclick="closeMenu()">✕</button>
            </div>
            <div class="drawer-section-label">Calculators</div>
            <button class="drawer-item" onclick="window.location.href='safe.html'">
                <span class="drawer-item-icon">
                    <svg width="24" height="24" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                            stroke="url(#lgDrawer1)" stroke-width="1.8" />
                        <rect x="10.5" y="16.2" width="15" height="3.6" rx="1.8" fill="url(#lgDrawer1)" />
                        <rect x="16.2" y="10.5" width="3.6" height="15" rx="1.8" fill="url(#lgDrawer1)" />
                    </svg>
                </span>
                <div class="drawer-item-info">
                    <div class="drawer-item-name">SAFE+</div>
                    <div class="drawer-item-desc">Equity & dilution modeling</div>
                </div>
            </button>
            <button class="drawer-item" onclick="window.location.href='coffee.html'">
                <span class="drawer-item-icon">
                    <svg width="24" height="24" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                            stroke="url(#lgDrawer1)" stroke-width="1.8" />
                        <path d="M14 10 C 22 10, 26 14, 26 22 C 18 26, 10 22, 14 10 Z" fill="url(#lgDrawer1)" />
                        <path d="M16 12 C 20 16, 20 20, 20 20" stroke="#0d0f1a" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <div class="drawer-item-info">
                    <div class="drawer-item-name">Yield+</div>
                    <div class="drawer-item-desc">Yield & NFT revenue</div>
                </div>
            </button>
            <div class="drawer-footer">SV Founders Tools</div>
        </div>

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                        stroke="url(#lgDrawer1)" stroke-width="1.8" />
                    <rect x="10.5" y="16.2" width="15" height="3.6" rx="1.8" fill="url(#lgDrawer1)" />
                    <rect x="16.2" y="10.5" width="3.6" height="15" rx="1.8" fill="url(#lgDrawer1)" />
                </svg>
                <span class="logo-text">SV<span class="logo-accent">Tools</span></span>
            </div>

            <div class="header-actions">
                <button class="hbtn" id="langBtn">EN</button>
                <button class="hbtn" id="themeBtn">🌙</button>
            </div>
        </header>

        <!-- MAIN (Hub Cards) -->
        <main class="mc"
            style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px); flex-direction: column;">
            <div style="width: 100%; max-width: 900px; padding: 20px;">
                <h2 style="margin-bottom: 32px; color: var(--text-main); font-weight: 600; text-align: center; font-size: 28px;"
                    data-i18n="hub_title">Select a Tool</h2>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">

                    <!-- SAFE+ Card -->
                    <div class="card hub-card" onclick="window.location.href='safe.html'">
                        <div class="card-body"
                            style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 32px;">
                            <div
                                style="margin-bottom: 24px; padding: 20px; background: rgba(124, 109, 255, 0.05); border-radius: 50%;">
                                <svg width="64" height="64" viewBox="0 0 36 36" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                                        stroke="url(#lgDrawer1)" stroke-width="1.8" />
                                    <rect x="10.5" y="16.2" width="15" height="3.6" rx="1.8" fill="url(#lgDrawer1)" />
                                    <rect x="16.2" y="10.5" width="3.6" height="15" rx="1.8" fill="url(#lgDrawer1)" />
                                </svg>
                            </div>
                            <h3
                                style="font-size: 22px; font-weight: 600; color: var(--text-main); margin-bottom: 12px;">
                                SAFE+</h3>
                            <p style="color: var(--text-muted); font-size: 15px; line-height: 1.6;">Equity &
                                dilution
                                modeling tailored for startup founders and investors.</p>
                        </div>
                    </div>

                    <!-- Coffee Farm Card -->
                    <div class="card hub-card" onclick="window.location.href='coffee.html'">
                        <div class="card-body"
                            style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 32px;">
                            <div
                                style="margin-bottom: 24px; padding: 20px; background: rgba(124, 109, 255, 0.05); border-radius: 50%;">
                                <svg width="64" height="64" viewBox="0 0 36 36" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 2.5 L32 10 L32 26 L18 33.5 L4 26 L4 10 Z" fill="url(#lgDrawer2)"
                                        stroke="url(#lgDrawer1)" stroke-width="1.8" />
                                    <path d="M14 10 C 22 10, 26 14, 26 22 C 18 26, 10 22, 14 10 Z"
                                        fill="url(#lgDrawer1)" />
                                    <path d="M16 12 C 20 16, 20 20, 20 20" stroke="#0d0f1a" stroke-width="2"
                                        stroke-linecap="round" />
                                </svg>
                            </div>
                            <h3 style="font-size: 22px; font-weight: 600; color: var(--text-main); margin-bottom: 12px;"
                                data-i18n="t2_title">Yield+</h3>
                            <p style="color: var(--text-muted); font-size: 15px; line-height: 1.6;" data-i18n="t2_desc">
                                Forecast multi-farm green yields and analyze NFT sales and
                                global coffee revenue.</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        document.addEventListener('DOMContentLoaded', () => {
            if (tg) {
                tg.ready();
                tg.expand();
                if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
                if (tg.requestFullscreen) {
                    try { tg.requestFullscreen(); } catch (e) { console.log('Fullscreen API err:', e); }
                }

                // Bind safe area insets
                function updateSafeArea() {
                    let topInset = 0;
                    let bottomInset = 0;

                    const insets = tg.contentSafeAreaInsets || tg.safeAreaInset;
                    if (insets) {
                        topInset = insets.top;
                        bottomInset = insets.bottom;
                    }

                    // Fallback for older Telegram clients or if SDK reports 0 on iOS Notch
                    // Force minimum top inset for TMA to prevent header overlap
                    topInset = Math.max(100, topInset);

                    document.documentElement.style.setProperty('--tg-safe-area-inset-top', topInset + 'px');
                    document.documentElement.style.setProperty('--tg-safe-area-inset-bottom', bottomInset + 'px');
                }
                updateSafeArea();
                tg.onEvent('contentSafeAreaChanged', updateSafeArea);
                tg.onEvent('safeAreaChanged', updateSafeArea);

                // Telegram expand event triggers layout changes, update padding just in case
                tg.onEvent('viewportChanged', () => {
                    if (tg.isExpanded) updateSafeArea();
                });

                // Theme syncing
                const setThemeTg = () => {
                    const params = tg.themeParams;
                    if (params.bg_color) {
                        const tgTheme = tg.colorScheme === 'light' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', tgTheme);
                        document.getElementById('themeBtn').textContent = tgTheme === 'dark' ? '🌙' : '☀️';
                    }
                };
                setThemeTg();
                tg.onEvent('themeChanged', setThemeTg);
            }

            // Override with localStorage if exists
            const savedTheme = localStorage.getItem('app_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
            }
        });

        const drawer = document.getElementById('appDrawer');
        const overlay = document.getElementById('drawerOverlay');
        function openMenu() {
            drawer.classList.add('open');
            overlay.classList.add('show');
        }
        function closeMenu() {
            drawer.classList.remove('open');
            overlay.classList.remove('show');
        }

        // Simple manual theme toggle for Web
        document.getElementById('themeBtn').addEventListener('click', () => {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('app_theme', newTheme);
        });

        // Simple English dummy toggle for Hub
        document.getElementById('langBtn').addEventListener('click', () => {
            const btn = document.getElementById('langBtn');
            const title = document.querySelector('[data-i18n="hub_title"]');
            if (btn.textContent === 'EN') {
                btn.textContent = 'RU';
                title.textContent = 'Выберите инструмент';
            } else {
                btn.textContent = 'EN';
                title.textContent = 'Select a Tool';
            }
        });
    </script>
</body>

</html>
